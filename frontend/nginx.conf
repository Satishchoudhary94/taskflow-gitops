# TaskFlow frontend — nginx site config (nginx-unprivileged, listens on 8080).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Runtime config generated by the entrypoint script (writable /tmp,
    # because the container filesystem can be mounted read-only).
    location = /config.js {
        alias /tmp/taskflow-runtime-config.js;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets are immutable — cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback: every unknown path serves index.html (client-side router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Simple probe endpoint for the web tier itself.
    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }
}
