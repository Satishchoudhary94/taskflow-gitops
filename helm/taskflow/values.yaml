# Default values for the TaskFlow chart.
# Every key here can be overridden with -f values-<env>.yaml or --set.
# These defaults reproduce what k8s/*.yaml deploys today.

# ------------------------------------------------------------------
# Backend (Node.js API)
# ------------------------------------------------------------------
backend:
  # Ignored when autoscaling.enabled is true (the HPA owns the replica count then)
  replicas: 2

  image:
    repository: schoudhary94/taskflow-backend
    # Empty → Chart.yaml appVersion. CI sets this to the commit SHA.
    tag: v2
    pullPolicy: IfNotPresent

  containerPort: 3000

  service:
    type: ClusterIP
    port: 3000

  # Non-secret settings → ConfigMap → env vars.
  # DATABASE_HOST is filled in automatically when postgres.enabled is true.
  # Set it here only when using an external database.
  config:
    DATABASE_PORT: "5432"
    DATABASE_NAME: taskflow
    DATABASE_USER: taskflow
    NODE_ENV: production
    LOG_LEVEL: info

  # Dedicated identity for the backend pods. The Vault role is bound to this name.
  serviceAccount:
    create: true
    # Empty → <release>-backend
    name: ""

  # The chart does NOT create Secrets (real values never go into Git).
  # They must already exist in the release namespace; only names/keys go here.
  # With vault.enabled, point these at vault.destinationSecret to read from Vault.
  secrets:
    databasePassword:
      name: taskflow-backend-secret-vault
      key: DATABASE_PASSWORD
    jwtSecret:
      name: taskflow-backend-secret-vault
      key: JWT_SECRET

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  networkPolicy:
    # Restrict backend egress to Postgres + DNS (see the 2026-10-08 incident:
    # without the DNS rule the backend cannot resolve the Postgres service name).
    enabled: true

# ------------------------------------------------------------------
# Vault (via the Vault Secrets Operator, installed separately)
# ------------------------------------------------------------------
vault:
  # true → VSO syncs the backend secret from Vault into destinationSecret.
  # It does not switch the backend over by itself: change backend.secrets too.
  # Rollback: point backend.secrets back at the old Secrets FIRST, then disable.
  enabled: true
  # LAB: plain HTTP inside the cluster. Production: https + CA.
  address: http://vault-active.vault.svc.cluster.local:8200
  authMount: kubernetes
  # Vault role bound to the backend ServiceAccount in this namespace
  role: taskflow-backend
  audience: vault
  kvMount: taskflow
  # Read as <kvMount>/data/<path>; keys: JWT_SECRET, DATABASE_PASSWORD
  path: prod/backend
  refreshAfter: 60s
  # Kubernetes Secret that VSO creates and owns
  destinationSecret: taskflow-backend-secret-vault

# ------------------------------------------------------------------
# Frontend (React SPA served by nginx-unprivileged on 8080)
# ------------------------------------------------------------------
frontend:
  replicas: 2

  image:
    repository: schoudhary94/taskflow-frontend
    tag: v1
    pullPolicy: IfNotPresent

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80

  # Written into /config.js at container start. Empty = same origin (/api via the Ingress).
  apiUrl: ""

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 512m
      memory: 1000Mi

  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /healthz
      initialDelaySeconds: 3
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

# ------------------------------------------------------------------
# PostgreSQL (single-instance StatefulSet)
# ------------------------------------------------------------------
postgres:
  # false → bring your own database and set backend.config.DATABASE_HOST
  enabled: true

  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent

  port: 5432

  # Existing Secret with POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
  existingSecret: taskflow-postgres-secret

  persistence:
    storageClassName: standard
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  resources: {}

  networkPolicy:
    # Only backend pods may connect to Postgres on 5432
    enabled: true

# ------------------------------------------------------------------
# Ingress (ingress-nginx): /api → backend, / → frontend
# ------------------------------------------------------------------
ingress:
  name: taskflow-ingress
  enabled: true
  className: nginx
  host: taskflow.local
  annotations: {}
  # tls:
  #   secretName: taskflow-tls
  tls: {}
