{{- if .Values.backend.networkPolicy.enabled }}
{{- $ctx := dict "root" . "component" "backend" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress-policy
  labels:
    {{- include "taskflow.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskflow.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.postgres.enabled }}
    # Postgres
    - to:
        - podSelector:
            matchLabels:
              {{- include "taskflow.selectorLabels" (dict "root" . "component" "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    {{- end }}
    # DNS: required to resolve service names like <release>-postgres
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
