{{- if .Values.backend.serviceAccount.create }}
{{- $ctx := dict "root" . "component" "backend" -}}
# Dedicated identity for the backend. Vault trusts this ServiceAccount (not
# "default"), so other pods in the namespace cannot read the backend's secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taskflow.backendServiceAccountName" $ctx }}
  labels:
    {{- include "taskflow.labels" $ctx | nindent 4 }}
# The backend never calls the Kubernetes API; VSO requests tokens for this SA itself
automountServiceAccountToken: false
{{- end }}
