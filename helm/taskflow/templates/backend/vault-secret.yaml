{{- if .Values.vault.enabled }}
{{- if not (.Capabilities.APIVersions.Has "secrets.hashicorp.com/v1beta1/VaultStaticSecret") }}
{{- fail "vault.enabled=true needs the Vault Secrets Operator CRDs (secrets.hashicorp.com/v1beta1) installed in the cluster" }}
{{- end }}
{{- $ctx := dict "root" . "component" "backend" -}}
{{- with .Values.vault -}}
# Vault Secrets Operator: log in to Vault as the backend's ServiceAccount, read
# the backend secret from KV v2, and keep a Kubernetes Secret in sync with it.
# The backend itself never talks to Vault.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: {{ include "taskflow.fullname" $ctx }}-vault
  labels:
    {{- include "taskflow.labels" $ctx | nindent 4 }}
spec:
  address: {{ required "vault.address is required" .address }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "taskflow.fullname" $ctx }}-vault
  labels:
    {{- include "taskflow.labels" $ctx | nindent 4 }}
spec:
  vaultConnectionRef: {{ include "taskflow.fullname" $ctx }}-vault
  method: kubernetes
  mount: {{ .authMount }}
  kubernetes:
    role: {{ required "vault.role is required" .role }}
    serviceAccount: {{ include "taskflow.backendServiceAccountName" $ctx }}
    audiences:
      - {{ .audience }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "taskflow.fullname" $ctx }}-vault
  labels:
    {{- include "taskflow.labels" $ctx | nindent 4 }}
spec:
  vaultAuthRef: {{ include "taskflow.fullname" $ctx }}-vault
  mount: {{ .kvMount }}
  type: kv-v2
  path: {{ required "vault.path is required" .path }}
  refreshAfter: {{ .refreshAfter }}
  destination:
    name: {{ .destinationSecret }}
    create: true
  # Env vars are read only at container start: restart the backend when the secret changes
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "taskflow.fullname" $ctx }}
{{- end }}
{{- end }}
