{{- $ctx := dict "root" . "component" "backend" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskflow.fullname" $ctx }}
  labels:
    {{- include "taskflow.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "taskflow.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
