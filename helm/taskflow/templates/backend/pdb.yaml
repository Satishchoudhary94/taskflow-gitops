{{- if .Values.backend.podDisruptionBudget.enabled }}
{{- $ctx := dict "root" . "component" "backend" -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "taskflow.fullname" $ctx }}
  labels:
    {{- include "taskflow.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "taskflow.selectorLabels" $ctx | nindent 6 }}
{{- end }}
