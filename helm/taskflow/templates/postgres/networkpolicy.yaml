{{- if and .Values.postgres.enabled .Values.postgres.networkPolicy.enabled }}
{{- $ctx := dict "root" . "component" "postgres" -}}
# Selecting the Postgres pods with an Ingress policy already denies all other
# inbound traffic, so this one object replaces both postgres-default-deny and
# postgres-network-policy from k8s/.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskflow.fullname" $ctx }}-ingress
  labels:
    {{- include "taskflow.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskflow.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "taskflow.selectorLabels" (dict "root" . "component" "backend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
{{- end }}
