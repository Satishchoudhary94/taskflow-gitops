apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: taskflow-backend-hpa
  namespace: taskflow

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskflow-backend

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
