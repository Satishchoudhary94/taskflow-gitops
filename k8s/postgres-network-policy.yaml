apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: postgres-network-policy
  namespace: taskflow

spec:
  podSelector:
    matchLabels:
      app: taskflow-postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: taskflow-backend

      ports:
        - protocol: TCP
          port: 5432
