apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskflow-frontend
  namespace: taskflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskflow-frontend

  template:
    metadata:
      labels:
        app: taskflow-frontend

    spec:
      containers:
        - name: frontend
          image: schoudhary94/taskflow-frontend:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu : "512m"
              memory: "1000Mi" 
